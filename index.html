<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Doorbell</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16202a;--muted:#5b6876;--line:#d9dee4;--accent:#1f6feb;--ok:#1a7f37;--bad:#cf222e;--warn:#9a6700;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--card:#171e26;--text:#e6edf3;--muted:#9aa7b4;--line:#2d3742;--accent:#4c9aff;--ok:#3fb950;--bad:#f85149;--warn:#d29922}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--muted);margin:8px 0 4px}input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.secondary{background:transparent;color:var(--accent)}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
.muted{color:var(--muted);font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
ul{list-style:none;margin:0;padding:0}li{padding:10px 0;border-top:1px solid var(--line)}li:first-child{border-top:0}
#frame,#muxed,#liveFrame{width:100%;aspect-ratio:4/3;object-fit:contain;background:#000;border-radius:8px;display:block}
.hidden{display:none!important}#error{color:var(--bad);min-height:1.2em}
</style>
<main>
  <h1>Doorbell</h1>
  <p id="error" role="alert"></p>

  <section id="login" class="card hidden">
    <h2>Sign in</h2>
    <form id="loginForm">
      <label for="email">Viewer email</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <p><button type="submit">Sign in</button></p>
    </form>
    <p class="muted">Use the viewer login, not the doorbell's.</p>
  </section>

  <section id="app" class="hidden">
    <div id="live" class="card hidden">
      <div class="row spread"><h2>Front door</h2><span id="liveLink" class="muted">Connecting…</span></div>
      <p id="liveState" class="muted">Waiting for the doorbell…</p>
      <img id="liveFrame" class="hidden" alt="Live camera at the door">
      <p class="row">
        <button id="answer" disabled>Answer</button>
        <button id="hangup" class="secondary" disabled>End call</button>
        <button id="watch" class="secondary">Show camera</button>
        <button id="testRing" class="secondary hidden">Test ring</button>
      </p>
      <p id="verify" class="row hidden"><span>Is someone at the door?</span><button id="confirm">Yes</button><button id="reject" class="secondary">No</button></p>
      <p class="row"><button id="talk" disabled style="touch-action:none">Hold to talk</button><span id="talkNote" class="muted"></span></p>
    </div>
    <div class="card">
      <div class="row spread"><h2>Boards</h2><button id="logout" class="secondary">Sign out</button></div>
      <p id="boards" class="muted">Checking…</p>
      <p class="row"><button id="record">Record a clip</button><span id="recordNote" class="muted"></span></p>
    </div>
    <div id="player" class="card hidden">
      <img id="frame" alt="Recorded video frame">
      <p class="row spread"><span id="playerStatus" class="muted"></span><span class="row"><button id="play" disabled>Play</button><button id="package" class="secondary" disabled>Package A/V</button></span></p>
      <audio id="audio" preload="auto"></audio>
      <video id="muxed" class="hidden" controls preload="metadata"></video>
      <p><a id="download" class="hidden">Download packaged clip</a></p>
    </div>
    <div class="card">
      <h2>Recordings</h2>
      <ul id="visits"><li class="muted">Loading…</li></ul>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script src="live.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const cfg = window.CG2271 || {};
const STORE = 'cg2271_viewer_session';
let session = null, deviceId = null, refreshing = null, pollTimer = null, playback = null, recordMs = 20000;
let sessionGeneration = 0;
const CLAIM_LEASE_SECONDS = 300; // cloud_claim.h: expiry is terminal, not a delayed re-record
const MAX_PACKAGE_MS = 60000; // 30 s configured cap plus start offset; reject forged/unbounded metadata

function showError(text) { $('#error').textContent = text || ''; }
function save() { try { session ? localStorage.setItem(STORE, JSON.stringify(session)) : localStorage.removeItem(STORE); } catch {} }
function load() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { return null; } }
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

async function auth(grant, body) {
  const generation = grant === 'password' ? ++sessionGeneration : sessionGeneration;
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=${grant}`, {
    method: 'POST', headers: {apikey: cfg.key, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (generation !== sessionGeneration) throw Error('signed out');
  if (!r.ok) throw Error(j.msg || j.error_description || j.message || `sign-in failed (${r.status})`);
  session = {access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() / 1000 + j.expires_in};
  save();
}
async function fresh() {
  if (!session) throw Error('signed out');
  if (session.expires_at - 60 > Date.now() / 1000) return;
  if (!refreshing) {
    const pending = auth('refresh_token', {refresh_token: session.refresh_token})
      .finally(() => { if (refreshing === pending) refreshing = null; });
    refreshing = pending;
  }
  await refreshing; /* one refresh at a time: refresh tokens are single-use */
}
async function api(path, options = {}) {
  const generation = sessionGeneration;
  await fresh();
  if (generation !== sessionGeneration || !session) throw Error('signed out');
  const accessToken = session.access_token;
  const r = await fetch(cfg.url + path, {...options,
    headers: {apikey: cfg.key, Authorization: `Bearer ${accessToken}`, ...(options.headers || {})}});
  if (generation !== sessionGeneration) throw Error('signed out');
  if (r.status === 401) {
    const current = session && session.access_token === accessToken;
    if (current) signOut('Session expired; sign in again.');
    throw Error(current ? 'signed out' : 'request used an expired session; retry');
  }
  if (!r.ok) throw Error(`${path.split('?')[0]} failed (${r.status})`);
  return r;
}
async function sign(path) {
  const r = await api(`/storage/v1/object/sign/${path}`, {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({expiresIn: 600})});
  return `${cfg.url}/storage/v1${(await r.json()).signedURL}`;
}

function clearProtected() {
  stop();
  if (window.CG2271Live) window.CG2271Live.stop();
  $('#player').classList.add('hidden'); $('#playerStatus').textContent = '';
  $('#boards').textContent = ''; $('#visits').replaceChildren(); $('#recordNote').textContent = '';
  $('#record').disabled = false; $('#record').textContent = 'Record a clip'; recordMs = 20000;
}
function signOut(message) {
  ++sessionGeneration; refreshing = null;
  session = null; deviceId = null; save(); clearInterval(pollTimer); pollTimer = null; clearProtected();
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); showError(message);
}
async function start() {
  const generation = sessionGeneration;
  $('#app').classList.add('hidden'); clearProtected(); showError('');
  const links = await (await api('/rest/v1/viewer_access?select=device_id&limit=1')).json();
  if (generation !== sessionGeneration) return;
  if (!links.length) { signOut('This login is not linked to a doorbell yet. Run seed_viewer.sql.'); return; }
  deviceId = links[0].device_id;
  try {
    const c = await (await api(`/rest/v1/device_config?select=record_max_ms&device_id=eq.${deviceId}`)).json();
    if (c.length) recordMs = c[0].record_max_ms;
  } catch {}
  if (generation !== sessionGeneration) return;
  $('#record').textContent = `Record ${Math.round(recordMs / 1000)} s`;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  if (window.CG2271Live) window.CG2271Live.start({cfg, deviceId, token: async () => { await fresh(); return session.access_token; }});
  await poll();
  if (generation === sessionGeneration) pollTimer = setInterval(() => poll().catch(e => showError(e.message)), 3000);
}

function ago(iso) { const s = (Date.now() - Date.parse(iso)) / 1000; return s < 90 ? `${Math.round(s)} s ago` : `${Math.round(s / 60)} min ago`; }
function half(status, claimedAt, age, who, siblingStatus, siblingClaimedAt) {
  if (status === 'complete') return ['ok', `${who} ✓`];
  if (status === 'truncated') return ['warn', `${who} truncated`];
  if (status === 'recording') {
    const claimAge = claimedAt ? (Date.now() - Date.parse(claimedAt)) / 1000 : age;
    return !Number.isFinite(claimAge) || claimAge >= CLAIM_LEASE_SECONDS
      ? ['bad', `${who} timed out`] : ['warn', `${who} recording…`];
  }
  if (status === 'failed') return ['bad', `${who} failed`];
  if (siblingStatus && siblingStatus !== 'recording') return ['bad', `${who} did not answer`];
  const siblingAge = siblingClaimedAt ? (Date.now() - Date.parse(siblingClaimedAt)) / 1000 : Infinity;
  return age < CLAIM_LEASE_SECONDS || Number.isFinite(siblingAge) && siblingAge < CLAIM_LEASE_SECONDS
    ? ['muted', `waiting for ${who}`] : ['bad', `${who} did not answer`];
}
async function poll() {
  const generation = sessionGeneration;
  const [boards, visits] = await Promise.all([
    api(`/rest/v1/device_status?select=board,last_seen,state&device_id=eq.${deviceId}`).then(r => r.json()),
    api(`/rest/v1/visit?select=id,client_event_id,received_at,trigger,video_status,audio_status,video_path,audio_path,video_ms,video_frames,video_started_at,audio_started_at,audio_ms,audio_lost_blocks,audio_lost_samples,video_claimed_at,audio_claimed_at&device_id=eq.${deviceId}&order=id.desc&limit=15`).then(r => r.json())]);
  if (generation !== sessionGeneration) return;
  const names = {cam: 'Camera', s2: 'Microphone'};
  $('#boards').replaceChildren(...['cam', 's2'].map((b, i) => {
    const row = boards.find(x => x.board === b), span = document.createElement('span');
    const online = row && Date.now() - Date.parse(row.last_seen) < 150000;
    span.className = online ? 'ok' : 'bad';
    span.textContent = `${i ? ' · ' : ''}${names[b]}: ${online ? (row.state || 'online') : row ? `offline (seen ${ago(row.last_seen)})` : 'never seen'}`;
    return span;
  }));
  const list = $('#visits');
  if (!visits.length) { list.replaceChildren(Object.assign(document.createElement('li'), {className: 'muted', textContent: 'No recordings yet.'})); return; }
  list.replaceChildren(...visits.map(v => {
    const li = document.createElement('li'), age = (Date.now() - Date.parse(v.received_at)) / 1000;
    const top = document.createElement('div'); top.className = 'row spread';
    const when = document.createElement('strong'); when.textContent = new Date(v.received_at).toLocaleString();
    top.append(when);
    if (v.video_path || v.audio_path) {
      const b = document.createElement('button'); b.className = 'secondary'; b.textContent = 'Open';
      b.onclick = () => openVisit(v).catch(e => showError(e.message)); top.append(b);
    }
    const info = document.createElement('div'); info.className = 'muted';
    for (const [cls, text] of [half(v.video_status, v.video_claimed_at, age, 'camera', v.audio_status, v.audio_claimed_at), half(v.audio_status, v.audio_claimed_at, age, 'microphone', v.video_status, v.video_claimed_at)]) {
      const s = document.createElement('span'); s.className = cls; s.textContent = text + '  '; info.append(s);
    }
    if (v.audio_lost_blocks > 0) info.append(audioLossNote(v));
    if (v.trigger !== 'viewer') info.append(` (${v.trigger})`);
    li.append(top, info); return li;
  }));
}

$('#record').onclick = async () => {
  const button = $('#record'); button.disabled = true; $('#recordNote').textContent = 'Asking the boards…';
  try {
    await api('/rest/v1/visit', {method: 'POST', headers: {'Content-Type': 'application/json', Prefer: 'return=minimal'},
      body: JSON.stringify({client_event_id: uuid(), device_id: deviceId, trigger: 'viewer', started_uptime_ms: 0})});
    $('#recordNote').textContent = 'Requested. Boards poll every 2 s, record, then upload.';
    await poll();
  } catch (e) { showError(e.message); $('#recordNote').textContent = ''; }
  setTimeout(() => { button.disabled = false; }, (recordMs || 20000) + 5000);
};

function splitJpeg(bytes) {
  const frames = []; let begin = -1;
  for (let i = 0; i + 1 < bytes.length; i++) {
    if (bytes[i] !== 0xFF) continue;
    if (bytes[i + 1] === 0xD8 && begin < 0) begin = i;
    else if (bytes[i + 1] === 0xD9 && begin >= 0) { frames.push(bytes.subarray(begin, i + 2)); begin = -1; i++; }
  }
  return frames;
}
function stop() {
  if (playback) {
    if (playback.exporting) playback.exporting.cancel();
    cancelAnimationFrame(playback.raf); clearTimeout(playback.timer);
    playback.urls.forEach(u => URL.revokeObjectURL(u));
    if (playback.muxUrl) URL.revokeObjectURL(playback.muxUrl);
    playback = null;
  }
  const audio = $('#audio'), img = $('#frame'), play = $('#play'), packageButton = $('#package');
  const muxed = $('#muxed'), download = $('#download');
  audio.pause(); audio.muted = false; audio.removeAttribute('src'); audio.load();
  img.removeAttribute('src'); delete img.dataset.i;
  muxed.pause(); muxed.removeAttribute('src'); muxed.load(); muxed.classList.add('hidden');
  download.removeAttribute('href'); download.removeAttribute('download'); download.classList.add('hidden');
  play.onclick = null; play.disabled = true;
  packageButton.onclick = null; packageButton.disabled = true; packageButton.textContent = 'Package A/V';
}
function audioLossNote(v) {
  if (v.audio_lost_samples > 0) {
    const ms = v.audio_lost_samples / 16;
    return ` · ${v.audio_lost_samples} audio samples (${Number.isInteger(ms) ? ms : ms.toFixed(2)} ms) replaced with silence; timing preserved`;
  }
  if (!(v.audio_lost_blocks > 0)) return '';
  return v.audio_claimed_at
    ? ` · ${v.audio_lost_blocks * 20} ms audio replaced with silence; timing preserved`
    : ` · ${v.audio_lost_blocks} lost audio blocks; legacy clip alignment unreliable`;
}
function mediaTiming(v, frameCount, hasAudio, decodedAudioMs = 0) {
  const videoMs = frameCount ? (v.video_ms || frameCount * 100) : 0;
  const frameMs = frameCount ? videoMs / frameCount : 100;
  /* Positive offset: video started after audio. Both boards stamp SNTP wall time. */
  const offset = v.video_started_at && v.audio_started_at
    ? Date.parse(v.video_started_at) - Date.parse(v.audio_started_at) : 0;
  const videoDelay = hasAudio ? Math.max(0, offset) : 0;
  const audioDelay = frameCount ? Math.max(0, -offset) : 0;
  const audioMs = hasAudio ? (v.audio_ms || decodedAudioMs) : 0;
  return {videoMs, frameMs, offset, videoDelay, audioDelay, audioMs,
    total: Math.max(videoDelay + videoMs, audioDelay + audioMs)};
}
function packageMimeType() {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (typeof MediaRecorder === 'undefined' || typeof MediaStream === 'undefined' ||
      typeof Image === 'undefined' || !Audio) return '';
  const canvas = document.createElement('canvas');
  if (typeof canvas.captureStream !== 'function') return '';
  const choices = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus',
    'video/webm', 'video/mp4'];
  if (typeof MediaRecorder.isTypeSupported !== 'function') return 'video/webm';
  return choices.find(type => MediaRecorder.isTypeSupported(type)) || '';
}
function drawContained(ctx, canvas, image) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const scale = Math.min(canvas.width / image.naturalWidth, canvas.height / image.naturalHeight);
  const width = image.naturalWidth * scale, height = image.naturalHeight * scale;
  ctx.drawImage(image, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
}
function loadFrame(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image); image.onerror = () => reject(Error('video frame could not be decoded'));
    image.src = url;
  });
}
async function packageVisit(v, generation, context, contextReady) {
  const state = playback, status = $('#playerStatus'), play = $('#play'), packageButton = $('#package');
  if (!state || !state.urls.length || !v.audio_path) return;
  const mime = packageMimeType();
  if (!mime) throw Error('this browser cannot package canvas video with audio');
  cancelAnimationFrame(state.raf); clearTimeout(state.timer); $('#audio').pause(); $('#muxed').pause();
  play.disabled = true; packageButton.disabled = true; packageButton.textContent = 'Packaging…';

  const aborter = new AbortController();
  let cancelled = false, recorder = null, source = null, combined = null;
  let frameRaf = 0, endTimer = 0;
  const release = stopRecorder => {
    cancelAnimationFrame(frameRaf); clearTimeout(endTimer);
    if (stopRecorder && recorder && recorder.state !== 'inactive') { try { recorder.stop(); } catch {} }
    if (source) { try { source.stop(); } catch {} source = null; }
    if (combined) { combined.getTracks().forEach(track => track.stop()); combined = null; }
    if (context) { context.close().catch(() => {}); context = null; }
  };
  const cancel = () => { cancelled = true; aborter.abort(); release(true); };
  state.exporting = {cancel};
  try {
    await contextReady;
    if (cancelled || generation !== sessionGeneration || playback !== state) return;
    status.textContent = 'Loading audio for packaging…';
    const audioUrl = await sign(v.audio_path);
    if (cancelled || generation !== sessionGeneration || playback !== state) return;
    const response = await fetch(audioUrl, {signal: aborter.signal});
    if (!response.ok) throw Error(`audio download failed (${response.status})`);
    const audioBytes = await response.arrayBuffer();
    if (cancelled || generation !== sessionGeneration || playback !== state) return;

    const audioBuffer = await context.decodeAudioData(audioBytes);
    const firstFrame = await loadFrame(state.urls[0]);
    if (cancelled || generation !== sessionGeneration || playback !== state) return;

    const canvas = document.createElement('canvas');
    canvas.width = firstFrame.naturalWidth; canvas.height = firstFrame.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const timing = mediaTiming(v, state.urls.length, true, audioBuffer.duration * 1000);
    if (!Number.isFinite(timing.total) || timing.total <= 0 || timing.total > MAX_PACKAGE_MS)
      throw Error('clip timing metadata is outside the package limit');
    if (timing.videoDelay === 0) drawContained(ctx, canvas, firstFrame);

    const canvasStream = canvas.captureStream(30);
    const destination = context.createMediaStreamDestination();
    /* Encode the timestamp offset as real silence in a total-length buffer.
     * The recorded samples are copied unchanged: no stretch or correlation. */
    const outputSamples = Math.ceil(timing.total * audioBuffer.sampleRate / 1000);
    const audioStart = Math.round(timing.audioDelay * audioBuffer.sampleRate / 1000);
    const packagedAudio = context.createBuffer(audioBuffer.numberOfChannels, outputSamples,
      audioBuffer.sampleRate);
    for (let channel = 0; channel < audioBuffer.numberOfChannels; channel++) {
      const input = audioBuffer.getChannelData(channel);
      packagedAudio.getChannelData(channel).set(input.subarray(0, outputSamples - audioStart), audioStart);
    }
    source = context.createBufferSource(); source.buffer = packagedAudio; source.connect(destination);
    combined = new MediaStream([...canvasStream.getVideoTracks(), ...destination.stream.getAudioTracks()]);
    recorder = new MediaRecorder(combined, {mimeType: mime});
    const chunks = [];
    const stopped = new Promise((resolve, reject) => {
      recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
      recorder.onerror = event => reject(event.error || Error('media recorder failed'));
      recorder.onstop = resolve;
    });
    recorder.start(1000);
    /* Force a t=0 video sample. A canvas painted only before captureStream()
     * can otherwise make the container begin at the first later frame. */
    if (timing.videoDelay === 0) drawContained(ctx, canvas, firstFrame);
    else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
    const videoTrack = canvasStream.getVideoTracks()[0];
    if (videoTrack && typeof videoTrack.requestFrame === 'function') videoTrack.requestFrame();
    const t0 = performance.now();
    source.start(context.currentTime);
    status.textContent = `Packaging ${(timing.total / 1000).toFixed(1)} s in real time… keep this page open`;

    let target = timing.videoDelay === 0 ? 0 : -1;
    const showFrame = index => {
      target = index;
      const pending = index === 0 ? Promise.resolve(firstFrame) : loadFrame(state.urls[index]);
      pending.then(image => {
        if (!cancelled && target === index && playback === state) drawContained(ctx, canvas, image);
      }).catch(() => {});
    };
    const render = () => {
      if (cancelled || playback !== state) return;
      const elapsed = performance.now() - t0;
      const index = Math.floor((elapsed - timing.videoDelay) / timing.frameMs);
      if (index >= 0 && index < state.urls.length) {
        if (target !== index) showFrame(index);
      } else if (target !== -1) {
        target = -1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      if (elapsed < timing.total) frameRaf = requestAnimationFrame(render);
    };
    render();
    endTimer = setTimeout(() => { if (recorder.state !== 'inactive') recorder.stop(); }, Math.max(1, timing.total));
    await stopped;
    release(false);
    if (cancelled || generation !== sessionGeneration || playback !== state) return;
    if (!chunks.length) throw Error('browser produced an empty packaged file');

    if (state.muxUrl) URL.revokeObjectURL(state.muxUrl);
    const blob = new Blob(chunks, {type: recorder.mimeType || mime});
    state.muxUrl = URL.createObjectURL(blob);
    const muxed = $('#muxed'), download = $('#download');
    muxed.src = state.muxUrl; muxed.classList.remove('hidden');
    const extension = (recorder.mimeType || mime).startsWith('video/mp4') ? 'mp4' : 'webm';
    download.href = state.muxUrl; download.download = `doorbell-${v.id}.${extension}`;
    download.classList.remove('hidden');
    status.textContent = `Packaged ${extension.toUpperCase()} · timestamp-aligned audio + video` + audioLossNote(v);
  } catch (error) {
    release(true);
    if (cancelled || error.name === 'AbortError' || generation !== sessionGeneration) return;
    throw error;
  } finally {
    release(true);
    if (playback === state) {
      state.exporting = null; play.disabled = false; packageButton.disabled = false;
      packageButton.textContent = 'Package A/V';
    }
  }
}
async function openVisit(v) {
  const generation = sessionGeneration;
  stop(); showError('');
  const status = $('#playerStatus'), play = $('#play'), packageButton = $('#package');
  const audio = $('#audio'), img = $('#frame');
  $('#player').classList.remove('hidden'); play.disabled = true; status.textContent = 'Loading…';
  const [videoUrl, audioUrl] = await Promise.all([v.video_path && sign(v.video_path), v.audio_path && sign(v.audio_path)]);
  if (generation !== sessionGeneration) return;
  let urls = [];
  if (videoUrl) {
    const bytes = new Uint8Array(await (await fetch(videoUrl)).arrayBuffer());
    if (generation !== sessionGeneration) return;
    urls = splitJpeg(bytes).map(f => URL.createObjectURL(new Blob([f], {type: 'image/jpeg'})));
  }
  const timing = mediaTiming(v, urls.length, Boolean(audioUrl));
  if (audioUrl) audio.src = audioUrl;
  if (urls.length) img.src = urls[0]; else img.removeAttribute('src');
  playback = {urls, raf: 0, timer: 0, muxUrl: null, exporting: null};
  status.textContent = `${urls.length ? `${urls.length} frames` : 'no video'} · ${audioUrl ? 'audio' : 'no audio'}` +
    (videoUrl && audioUrl ? ` · offset ${Math.round(timing.offset)} ms` : '') + audioLossNote(v);
  // Missing blocks in current firmware are already silence in the WAV: never
  // compress/stretch it or subtract audio_lost_blocks from the playback offset.
  play.disabled = false;
  play.onclick = () => {
    const state = playback, t0 = performance.now(); play.disabled = true;
    cancelAnimationFrame(state.raf); clearTimeout(state.timer); $('#muxed').pause();
    if (timing.videoDelay > 0) { img.removeAttribute('src'); delete img.dataset.i; }
    if (audioUrl) {
      /* Start inside the tap so phones allow sound; if audio must wait, start muted and pause. */
      audio.currentTime = 0; audio.muted = timing.audioDelay > 0;
      audio.play().then(() => {
        if (generation !== sessionGeneration || playback !== state || !timing.audioDelay) return;
        audio.pause(); audio.muted = false; state.timer = setTimeout(() => audio.play(), timing.audioDelay);
      }).catch(() => {
        if (generation === sessionGeneration) { status.textContent = 'Tap Play again to allow sound'; play.disabled = false; }
      });
    }
    const tick = () => {
      if (generation !== sessionGeneration || playback !== state) return;
      const elapsed = performance.now() - t0;
      const index = Math.floor((elapsed - timing.videoDelay) / timing.frameMs);
      if (index >= 0 && index < urls.length && img.dataset.i !== String(index)) {
        img.src = urls[index]; img.dataset.i = index;
      }
      if (elapsed > timing.total + 200) { play.disabled = false; return; }
      state.raf = requestAnimationFrame(tick);
    };
    tick();
  };
  const canPackage = videoUrl && audioUrl && packageMimeType();
  packageButton.disabled = !canPackage;
  packageButton.title = canPackage ? 'Create one timestamp-aligned file in this browser' :
    videoUrl && audioUrl ? 'Packaging is not supported by this browser' : 'Both audio and video are required';
  packageButton.onclick = canPackage ? () => {
    const Audio = window.AudioContext || window.webkitAudioContext;
    let context = null;
    try {
      context = new Audio();
      const contextReady = context.resume();
      packageVisit(v, generation, context, contextReady).catch(error => {
        if (generation === sessionGeneration) status.textContent = `Packaging failed: ${error.message}`;
      });
    } catch (error) {
      if (context) context.close().catch(() => {});
      if (generation === sessionGeneration) status.textContent = `Packaging failed: ${error.message}`;
    }
  } : null;
}

$('#loginForm').onsubmit = async e => {
  e.preventDefault(); showError('');
  try { await auth('password', {email: $('#email').value, password: $('#password').value}); $('#password').value = ''; await start(); }
  catch (err) { showError(err.message); }
};
$('#logout').onclick = () => signOut('');

if (!cfg.url || !cfg.key) {
  showError('Missing config.js. Open this page from the camera board (http://<camera-ip>/recordings), or on a laptop with tools/serve_viewer.py.');
} else if ((session = load())) {
  const generation = sessionGeneration;
  start().catch(e => { if (generation === sessionGeneration) signOut(e.message); });
} else {
  $('#login').classList.remove('hidden');
}
</script>
